name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mod:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Linux bridge build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgl-dev libglx-dev libegl-dev libopengl-dev
      - name: Build mod and Linux JNI tests
        if: runner.os == 'Linux'
        run: ./gradlew build testNativeLinux64 -Parch=linux64 --console=plain
      - name: Build mod and Windows JNI bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat build test --console=plain

  buffer-tables:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure buffer table tests
        run: cmake -S runtime/tests/rtx/unit -B runtime/_BufferTests
      - name: Build buffer table tests
        run: cmake --build runtime/_BufferTests --config Release --parallel 2
      - name: Test descriptor updates and buffer lifetimes
        run: ctest --test-dir runtime/_BufferTests --build-config Release --output-on-failure
      - name: Collect portable Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Output = 'runtime/_BufferTests/portable'
          New-Item -ItemType Directory -Path $Output -Force | Out-Null
          Copy-Item runtime/_BufferTests/Release/test_*.exe $Output
          Copy-Item runtime/LICENSE-MIT "$Output/LICENSE-MIT.txt"
          Copy-Item packaging/licenses/remix-runtime/LICENSE.xxhash.txt "$Output/xxHash-LICENSE.txt"
          Get-ChildItem -LiteralPath $Output -File | Sort-Object Name | ForEach-Object {
            $Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)"
          } | Set-Content -LiteralPath "$Output/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: pathmine-buffer-tests-windows-x64
          path: runtime/_BufferTests/portable/
          if-no-files-found: error
          retention-days: 14

  native-platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install platform build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libvulkan-dev locales
          sudo localedef -i ru_RU -f UTF-8 ru_RU.UTF-8
      - name: Configure native platform and pinned header dependencies
        run: >-
          cmake -S runtime/native -B runtime/_NativePlatform -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          -DREMIX_MINECRAFT_API_HEADER="$GITHUB_WORKSPACE/rtxremix-java/native/include/remix_c.h"
      - name: Build native platform
        run: cmake --build runtime/_NativePlatform --parallel 2
      - name: Test CPU platform services
        run: >-
          ctest --test-dir runtime/_NativePlatform --output-on-failure
          -R '^native-(runtime-distribution-checker|shader-dependencies|api016-header|api-header|shared-library|platform-services|numeric-config|mapped-file|directory-watch|keybind|math)$'
